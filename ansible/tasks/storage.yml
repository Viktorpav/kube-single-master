- name: Ensure longhorn-system namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: longhorn-system

- name: Create AWS secret for backups (must exist for Longhorn validation)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: aws-secret
        namespace: longhorn-system
      stringData:
        AWS_ACCESS_KEY_ID: "{{ aws_access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ aws_secret_key }}"
        AWS_REGION: "{{ aws_region }}"

- name: Install/upgrade Longhorn
  kubernetes.core.helm:
    name: longhorn
    chart_ref: longhorn/longhorn
    release_namespace: longhorn-system
    create_namespace: true
    wait: false
    values:
      defaultSettings:
        defaultReplicaCount: 1
        backupTarget: "s3://{{ longhorn_s3_bucket }}@{{ aws_region }}/"
        backupTargetCredentialSecret: aws-secret
        allowRecurringJobWhileVolumeDetached: true
        autoCleanupSystemGeneratedSnapshot: true
        backupstorePollInterval: 30
        nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
        replicaSoftAntiAffinity: false
        replicaReplenishmentWaitInterval: 60
        staleReplicaTimeout: 5
        replicaNodeSoftAntiAffinity: false
        disableSchedulingOnCordonedNode: true
        concurrentReplicaRebuildPerNodeLimit: 1
      longhornManager:
        tolerations:
          - key: node.kubernetes.io/unreachable
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 10
          - key: node.kubernetes.io/not-ready
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 10
      longhornDriver:
        tolerations:
          - key: node.kubernetes.io/unreachable
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 10
          - key: node.kubernetes.io/not-ready
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 10
      ui:
        replicas: 1
        tolerations:
          - key: node.kubernetes.io/unreachable
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 10
          - key: node.kubernetes.io/not-ready
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 10
      persistence:
        defaultClass: true
        defaultClassReplicaCount: 1
        reclaimPolicy: Retain

  register: longhorn_helm_install
  until: longhorn_helm_install is success
  retries: 5
  delay: 15

- name: Create storage-only Longhorn StorageClass
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: longhorn-storage
      provisioner: driver.longhorn.io
      allowVolumeExpansion: true
      reclaimPolicy: Retain
      volumeBindingMode: WaitForFirstConsumer
      parameters:
        numberOfReplicas: "1"
        staleReplicaTimeout: "30"

- name: Wait for Longhorn manager to be ready (all containers in all pods)
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: longhorn-system
    label_selectors:
      - app=longhorn-manager
  register: longhorn_manager_pods
  until: >
    longhorn_manager_pods.resources | length >= 1 and
    (longhorn_manager_pods.resources 
     | selectattr('status.phase', 'equalto', 'Running')
     | selectattr('status.containerStatuses', 'defined')
     | map(attribute='status.containerStatuses') 
     | flatten 
     | map(attribute='ready') 
     | list 
     | unique) == [True]
  retries: 60
  delay: 10

- name: Create Ingress for Longhorn UI
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: longhorn-ui
        namespace: longhorn-system
        annotations:
          cert-manager.io/cluster-issuer: "iooding-ca-issuer"
          nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      spec:
        ingressClassName: nginx
        tls:
          - hosts:
              - longhorn.local
            secretName: longhorn-tls
        rules:
          - host: longhorn.local
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: longhorn-frontend
                      port:
                        number: 80

- name: Create Recurring Backup Job (Default for all volumes)
  kubernetes.core.k8s:
    state: present
    definition: |
      apiVersion: longhorn.io/v1beta2
      kind: RecurringJob
      metadata:
        name: backup-daily
        namespace: longhorn-system
      spec:
        cron: "{{ backup_daily_cron }}"
        task: backup
        retain: {{ backup_daily_retain }}
        concurrency: 2
        groups:
          - default
        labels:
          backup: daily
  register: recurring_job_result
  retries: 10
  delay: 20
  until: recurring_job_result is success