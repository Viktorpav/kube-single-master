- name: Install Ingress NGINX (HA mode)
  kubernetes.core.helm:
    name: ingress-nginx
    chart_ref: ingress-nginx/ingress-nginx
    release_namespace: ingress-nginx
    create_namespace: true
    wait: false
    values:
      controller:
        replicaCount: 1
        tolerations:
          - key: stateless-only
            operator: Equal
            value: "true"
            effect: NoSchedule
        service:
          type: LoadBalancer
        admissionWebhooks:
          enabled: false

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi

        terminationGracePeriodSeconds: 5

        updateStrategy:
          type: Recreate

        config:
          worker-processes: "auto"
          keep-alive: "75"
          proxy-read-timeout: "60"
          proxy-send-timeout: "60"

  register: ingress_helm_install
  until: ingress_helm_install is success
  retries: 5
  delay: 15

- name: Wait for Ingress NGINX pods
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: ingress-nginx
    label_selectors:
      - app.kubernetes.io/component=controller
  register: ingress_pods
  until: >
    ingress_pods.resources | length >= 1 and
    ingress_pods.resources[0].status.containerStatuses is defined and
    ingress_pods.resources[0].status.containerStatuses[0].ready
  retries: 10
  delay: 5
