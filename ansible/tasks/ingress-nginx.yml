- name: Install Ingress NGINX (HA mode)
  kubernetes.core.helm:
    name: ingress-nginx
    chart_ref: ingress-nginx/ingress-nginx
    release_namespace: ingress-nginx
    create_namespace: true
    wait: false
    values:
      controller:
        replicaCount: 1
        service:
          type: LoadBalancer
        admissionWebhooks:
          enabled: false
        podAntiAffinity:
          type: soft
        tolerations:
          - operator: Exists
            effect: NoExecute
            tolerationSeconds: 10
          - operator: Exists
            effect: NoSchedule
          - key: CriticalAddonsOnly
            operator: Exists
          - key: node.kubernetes.io/unreachable
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 10
          - key: node.kubernetes.io/not-ready
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 10
        config:
          worker-processes: "auto"
          keep-alive: "75"
          proxy-next-upstream: "error timeout http_502 http_503 http_504"
          proxy-next-upstream-tries: "3"
          proxy-next-upstream-timeout: "10"
          proxy-connect-timeout: "5"
          proxy-read-timeout: "60"
          proxy-send-timeout: "60"
          upstream-max-fails: "1"
          upstream-fail-timeout: "5"
        terminationGracePeriodSeconds: 10
        updateStrategy:
          rollingUpdate:
            maxUnavailable: 1
        livenessProbe:
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

  register: ingress_helm_install
  until: ingress_helm_install is success
  retries: 5
  delay: 15

# PodDisruptionBudget removed to prevent blocking node drains in single-replica home lab setup

- name: Wait for Ingress NGINX pods
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: ingress-nginx
    label_selectors:
      - app.kubernetes.io/component=controller
  register: ingress_pods
  until: ingress_pods.resources | length >= 1 and (ingress_pods.resources | map(attribute='status.phase') | list | unique) == ['Running']
  retries: 10
  delay: 5
